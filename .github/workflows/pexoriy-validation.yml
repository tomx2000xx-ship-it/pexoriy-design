name: Pexoriy validation
on:
  push:
    branches: [main, 'scope/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pexoriy-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.js
      - name: Validate ordered SQL migrations against SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          migrations = sorted(Path("migrations").glob("*.sql"))
          if not migrations:
              raise SystemExit("No migrations found")
          for migration in migrations:
              db.executescript(migration.read_text(encoding="utf-8"))
          required = {"referral_codes", "referral_attributions", "referral_team_quests", "referral_team_quest_claims", "learning_lessons", "learning_attempts", "learning_progress", "presale_settings", "daily_checkins"}
          found = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - found
          if missing:
              raise SystemExit("Missing migration tables: " + ", ".join(sorted(missing)))
          lessons = db.execute("SELECT COUNT(*) FROM learning_lessons WHERE active=1").fetchone()[0]
          if lessons < 5:
              raise SystemExit(f"Expected at least five active learning lessons, found {lessons}")
          quests = db.execute("SELECT COUNT(*) FROM referral_team_quests WHERE active=1").fetchone()[0]
          if quests < 2:
              raise SystemExit(f"Expected at least two active referral team quests, found {quests}")
          community_mission = db.execute("SELECT active FROM mission_definitions WHERE id='community-challenge'").fetchone()
          if community_mission and community_mission[0] != 0:
              raise SystemExit("The community challenge mission must stay inactive until verified challenge entry exists")
          # Payment settlement safety: transaction hashes and provider references must be unique,
          # and credited state must require a finalized transaction.
          indexes = list(db.execute("PRAGMA index_list('payment_orders')"))
          unique_columns = set()
          for index in indexes:
              if index[2]:
                  unique_columns.update(info[2] for info in db.execute(f"PRAGMA index_info('{index[1]}')"))
          if not {"idempotency_key", "tx_hash", "reference_key"}.issubset(unique_columns):
              raise SystemExit("Missing unique payment-order idempotency, transaction-hash, or reference constraint")
          trigger_names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='trigger'")}
          if "trg_payment_credit_requires_verified_state" not in trigger_names or "trg_credited_payment_immutable" not in trigger_names:
              raise SystemExit("Missing payment finality or credited-order immutability guard")
          if not {"trg_daily_checkin_requires_posted_ledger", "trg_daily_checkin_immutable_update", "trg_daily_checkin_immutable_delete"}.issubset(trigger_names):
              raise SystemExit("Missing daily check-in ledger or immutability guard")
          # Exercise the database invariants with synthetic fixtures only; no live funds or production DB.
          db.execute("INSERT INTO users (id,email,display_name,password_salt,password_hash) VALUES ('ci-payment-user','ci-payment@example.test','CI Payment','salt','hash')")
          db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status,tx_hash,reference_key) VALUES ('ci-order-1','ci-payment-user','ci-idem-1','test','testnet','TEST',100,'confirmed','ci-tx-hash','ci-ref-1')")
          duplicate_tx_rejected = False
          try:
              db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status,tx_hash,reference_key) VALUES ('ci-order-2','ci-payment-user','ci-idem-2','test','testnet','TEST',100,'confirmed','ci-tx-hash','ci-ref-2')")
          except sqlite3.IntegrityError:
              duplicate_tx_rejected = True
          if not duplicate_tx_rejected:
              raise SystemExit("Payment schema accepted a transaction hash already used by another order")
          db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status) VALUES ('ci-order-3','ci-payment-user','ci-idem-3','test','testnet','TEST',100,'created')")
          unverified_credit_rejected = False
          try:
              db.execute("UPDATE payment_orders SET status='credited' WHERE id='ci-order-3'")
          except sqlite3.IntegrityError:
              unverified_credit_rejected = True
          if not unverified_credit_rejected:
              raise SystemExit("Payment schema allowed a credit without finalized transaction evidence")
          print(f"Validated {len(migrations)} ordered migrations, {lessons} learning lessons, {quests} team quests, payment settlement guards, and immutable daily check-ins.")
          PY
      - name: Run deterministic simulation and payment unit tests
        run: bun run test:unit
      - name: Build production bundle
        run: bun run build
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test rendered desktop and mobile product flows
        run: npx playwright test tests/e2e/product-flow.spec.js --reporter=line
      - name: Smoke-test release-candidate preview endpoints with explicit HTTP evidence
        if: github.ref == 'refs/heads/scope/mobile-rewards-competition-20261018'
        run: |
          set -eu
          base="https://scope-mobile-rewards-competition-20261018-pexoriy-design.mails4dikewills.workers.dev"
          check_code() {
            path="$1"; expected="$2"
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o "/tmp/pexoriy-candidate-$(echo "$path" | tr '/' '_').json" -w '%{http_code}' "$base$path" || true)"
            echo "HTTP evidence: GET $path -> $code (expected $expected)"
            if [ "$code" != "$expected" ]; then
              cat "/tmp/pexoriy-candidate-$(echo "$path" | tr '/' '_').json" || true
              exit 1
            fi
          }
          for attempt in $(seq 1 24); do
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/pexoriy-candidate-presale.json -w '%{http_code}' "$base/api/presale/status" || true)"
            echo "HTTP evidence: GET /api/presale/status -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$code" != "200" ]; then cat /tmp/pexoriy-candidate-presale.json || true; exit 1; fi
          python3 - <<'PY'
          import json
          with open("/tmp/pexoriy-candidate-presale.json", encoding="utf-8") as f:
              status = json.load(f)
          assert status.get("previewEnabled") is True, status
          assert status.get("saleEnabled") is False, status
          assert status.get("launchState") == "disabled", status
          print("Candidate presale safety evidence: previewEnabled=true, saleEnabled=false, launchState=disabled.")
          PY
          for endpoint in /api/health /api/markets /api/payments/solana/config /api/payments/ton/config /api/ai/config; do check_code "$endpoint" 200; done
          for endpoint in /api/learning /api/referrals /api/checkins /api/ai/activity /api/payments/solana/orders /api/payments/ton/orders; do check_code "$endpoint" 401; done
          echo "Candidate HTTP smoke checks passed with explicit status-code evidence."
      - name: Smoke-test deployed production endpoints with explicit HTTP evidence
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          base="https://pexoriy-design.mails4dikewills.workers.dev"
          check_code() {
            path="$1"; expected="$2"
            file="/tmp/pexoriy-production-$(echo "$path" | tr '/' '_').json"
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o "$file" -w '%{http_code}' "$base$path" || true)"
            echo "HTTP evidence: GET $path -> $code (expected $expected)"
            if [ "$code" != "$expected" ]; then cat "$file" || true; exit 1; fi
          }
          check_code /api/health 200
          check_code /api/markets 200
          check_code /api/presale/status 200
          check_code /api/payments/solana/config 200
          check_code /api/payments/ton/config 200
          check_code /api/ai/config 200
          for endpoint in /api/learning /api/referrals /api/checkins /api/ai/activity /api/payments/solana/orders /api/payments/ton/orders; do check_code "$endpoint" 401; done
          python3 - <<'PY'
          import json
          with open("/tmp/pexoriy-production-_api_presale_status.json", encoding="utf-8") as f:
              status = json.load(f)
          assert status.get("previewEnabled") is True, status
          assert status.get("saleEnabled") is False, status
          assert status.get("launchState") == "disabled", status
          print("Production presale safety evidence: previewEnabled=true, saleEnabled=false, launchState=disabled.")
          PY
          echo "Production HTTPS smoke checks passed with explicit status-code evidence."
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pexoriy-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
