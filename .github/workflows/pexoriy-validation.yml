name: Pexoriy validation
on:
  push:
    branches: [main, 'scope/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pexoriy-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.js
      - name: Validate ordered SQL migrations against SQLite
        run: |
          python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          migrations = sorted(Path("migrations").glob("*.sql"))
          if not migrations:
              raise SystemExit("No migrations found")
          for migration in migrations:
              db.executescript(migration.read_text(encoding="utf-8"))
          required = {"referral_codes", "referral_attributions", "referral_team_quests", "referral_team_quest_claims", "learning_lessons", "learning_attempts", "learning_progress", "presale_settings", "daily_checkins", "competition_rounds", "competition_participants", "competition_awards", "referral_pool_rounds", "referral_pool_awards", "pxy_issuance_controls"}
          found = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - found
          if missing:
              raise SystemExit("Missing migration tables: " + ", ".join(sorted(missing)))
          lessons = db.execute("SELECT COUNT(*) FROM learning_lessons WHERE active=1").fetchone()[0]
          if lessons < 5:
              raise SystemExit(f"Expected at least five active learning lessons, found {lessons}")
          quests = db.execute("SELECT COUNT(*) FROM referral_team_quests WHERE active=1").fetchone()[0]
          if quests < 2:
              raise SystemExit(f"Expected at least two active referral team quests, found {quests}")
          community_mission = db.execute("SELECT active,rules_json FROM mission_definitions WHERE id='community-challenge'").fetchone()
          if not community_mission or community_mission[0] != 1 or json.loads(community_mission[1]).get("prerequisite") != "community_challenge":
              raise SystemExit("The community challenge mission must use the persistent competition-entry eligibility rule")
          # Payment settlement safety: transaction hashes and provider references must be unique,
          # and credited state must require a finalized transaction.
          indexes = list(db.execute("PRAGMA index_list('payment_orders')"))
          unique_columns = set()
          for index in indexes:
              if index[2]:
                  unique_columns.update(info[2] for info in db.execute(f"PRAGMA index_info('{index[1]}')"))
          if not {"idempotency_key", "tx_hash", "reference_key"}.issubset(unique_columns):
              raise SystemExit("Missing unique payment-order idempotency, transaction-hash, or reference constraint")
          trigger_names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='trigger'")}
          if "trg_payment_credit_requires_verified_state" not in trigger_names or "trg_credited_payment_immutable" not in trigger_names:
              raise SystemExit("Missing payment finality or credited-order immutability guard")
          if not {"trg_daily_checkin_requires_posted_ledger", "trg_daily_checkin_immutable_update", "trg_daily_checkin_immutable_delete"}.issubset(trigger_names):
              raise SystemExit("Missing daily check-in ledger or immutability guard")
          # Exercise the database invariants with synthetic fixtures only; no live funds or production DB.
          db.execute("INSERT INTO users (id,email,display_name,password_salt,password_hash) VALUES ('ci-payment-user','ci-payment@example.test','CI Payment','salt','hash')")
          db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status,tx_hash,reference_key) VALUES ('ci-order-1','ci-payment-user','ci-idem-1','test','testnet','TEST',100,'confirmed','ci-tx-hash','ci-ref-1')")
          duplicate_tx_rejected = False
          try:
              db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status,tx_hash,reference_key) VALUES ('ci-order-2','ci-payment-user','ci-idem-2','test','testnet','TEST',100,'confirmed','ci-tx-hash','ci-ref-2')")
          except sqlite3.IntegrityError:
              duplicate_tx_rejected = True
          if not duplicate_tx_rejected:
              raise SystemExit("Payment schema accepted a transaction hash already used by another order")
          db.execute("INSERT INTO payment_orders (id,user_id,idempotency_key,provider,network,asset,expected_amount_atoms,status) VALUES ('ci-order-3','ci-payment-user','ci-idem-3','test','testnet','TEST',100,'created')")
          unverified_credit_rejected = False
          try:
              db.execute("UPDATE payment_orders SET status='credited' WHERE id='ci-order-3'")
          except sqlite3.IntegrityError:
              unverified_credit_rejected = True
          if not unverified_credit_rejected:
              raise SystemExit("Payment schema allowed a credit without finalized transaction evidence")
          gate = db.execute("SELECT reserves_verified, launch_approved, issuance_enabled FROM pxy_issuance_controls WHERE id=1").fetchone()
          if gate != (0, 0, 0):
              raise SystemExit(f"PXY issuance must default to gated, found {gate}")
          gate_rejected = False
          try:
              db.execute("UPDATE pxy_issuance_controls SET issuance_enabled=1 WHERE id=1")
          except sqlite3.IntegrityError:
              gate_rejected = True
          if not gate_rejected:
              raise SystemExit("PXY issuance gate allowed enablement without reserve and launch approval")
          pool = db.execute("SELECT pool_tc, status FROM referral_pool_rounds LIMIT 1").fetchone()
          db.execute("INSERT INTO competition_rounds (id,slug,title,period_start,period_end,prize_pool_pxy,status,payouts_enabled) VALUES ('ci-round','daily-sprint','CI Round','2026-10-18T00:00:00.000Z','2026-10-19T00:00:00.000Z',5000,'open',0)")
          payout_default = db.execute("SELECT payouts_enabled FROM competition_rounds WHERE id='ci-round'").fetchone()[0]
          if payout_default != 0:
              raise SystemExit("Competition PXY payouts must remain gated by default")
          print(f"Validated {len(migrations)} ordered migrations, {lessons} learning lessons, {quests} team quests, competition and referral pool schemas, default PXY issuance gate, payment settlement guards, and immutable daily check-ins.")
          PY
      - name: Run deterministic simulation and payment unit tests
        run: bun run test:unit
      - name: Build production bundle
        run: bun run build
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test rendered desktop and mobile product flows
        run: npx playwright test tests/e2e/product-flow.spec.js --reporter=line
      - name: Smoke-test release-candidate preview endpoints with explicit HTTP evidence
        if: github.ref == 'refs/heads/scope/mobile-rewards-competition-20261018'
        run: |
          set -eu
          base="https://scope-mobile-rewards-competition-20261018-pexoriy-design.mails4dikewills.workers.dev"
          check_code() {
            path="$1"; expected="$2"
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o "/tmp/pexoriy-candidate-$(echo "$path" | tr '/' '_').json" -w '%{http_code}' "$base$path" || true)"
            echo "HTTP evidence: GET $path -> $code (expected $expected)"
            if [ "$code" != "$expected" ]; then
              cat "/tmp/pexoriy-candidate-$(echo "$path" | tr '/' '_').json" || true
              exit 1
            fi
          }
          for attempt in $(seq 1 24); do
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/pexoriy-candidate-presale.json -w '%{http_code}' "$base/api/presale/status" || true)"
            echo "HTTP evidence: GET /api/presale/status -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$code" != "200" ]; then cat /tmp/pexoriy-candidate-presale.json || true; exit 1; fi
          python3 - <<'PY'
          import json
          with open("/tmp/pexoriy-candidate-presale.json", encoding="utf-8") as f:
              status = json.load(f)
          assert status.get("previewEnabled") is True, status
          assert status.get("saleEnabled") is False, status
          assert status.get("launchState") == "disabled", status
          print("Candidate presale safety evidence: previewEnabled=true, saleEnabled=false, launchState=disabled.")
          PY
          for endpoint in /api/health /api/markets /api/competitions /api/pxy/issuance-status /api/payments/solana/config /api/payments/ton/config /api/ai/config; do check_code "$endpoint" 200; done
          for endpoint in /api/learning /api/referrals /api/checkins /api/progress /api/ai/activity /api/competitions/join /api/referrals/pool/claim /api/payments/solana/orders /api/payments/ton/orders; do if [ "$endpoint" = "/api/competitions/join" ] || [ "$endpoint" = "/api/referrals/pool/claim" ]; then code="$(curl --connect-timeout 10 --max-time 25 -sS -X POST -H "content-type: application/json" -H "Origin: $base" -H "Sec-Fetch-Site: same-origin" -d "{}" -o "/tmp/pexoriy-candidate-$(echo "$endpoint" | tr '/' '_').json" -w '%{http_code}' "$base$endpoint" || true)"; echo "HTTP evidence: POST $endpoint -> $code (expected 401)"; if [ "$code" != "401" ]; then cat "/tmp/pexoriy-candidate-$(echo "$endpoint" | tr '/' '_').json" || true; exit 1; fi; else check_code "$endpoint" 401; fi; done
          python3 - <<'PY'
          import json
          def read(name):
              with open("/tmp/pexoriy-candidate-" + name + ".json", encoding="utf-8") as f: return json.load(f)
          sol = read("_api_payments_solana_config")
          ton = read("_api_payments_ton_config")
          gate = read("_api_pxy_issuance-status")
          ai = read("_api_ai_config")
          assert sol.get("enabled") is True and sol.get("network") == "solana-mainnet", sol
          assert ton.get("enabled") is True and ton.get("network") == "ton-mainnet" and ton.get("asset") == "GRAM", ton
          assert gate.get("enabled") is False and gate.get("status") == "gated", gate
          assert ai.get("providerConfigured") is True, ai
          print("Provider/gate evidence: SOL mainnet receiver configured; native GRAM/TON mainnet receiver configured; PXY issuance gated; Workers AI binding configured.")
          PY
          echo "Candidate HTTP smoke checks passed with explicit status-code evidence."
      - name: Live Workers AI inference and AC reserve-release-charge acceptance (isolated preview only)
        if: github.ref == 'refs/heads/scope/mobile-rewards-competition-20261018'
        timeout-minutes: 8
        run: |
          set -eu
          PREVIEW_BASE="https://scope-mobile-rewards-competition-20261018-pexoriy-design.mails4dikewills.workers.dev"
          export PREVIEW_BASE
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request, http.cookiejar
          base = os.environ["PREVIEW_BASE"]
          run_id = os.environ.get("GITHUB_RUN_ID", str(int(time.time())))
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path, method="GET", payload=None, expected=(200,)):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Accept":"application/json", "Origin":base, "Sec-Fetch-Site":"same-origin"}
              if data is not None: headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with opener.open(req, timeout=30) as response:
                      code, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  code, raw = error.code, error.read()
              print(f"AI acceptance HTTP evidence: {method} {path} -> {code} (expected one of {expected})")
              if code not in expected:
                  raise RuntimeError(f"{method} {path} returned HTTP {code}: {raw[:800].decode(errors='replace')}")
              try: return json.loads(raw or b"{}")
              except Exception: raise RuntimeError(f"{path} returned invalid JSON")
          call("/api/health")
          call("/api/markets")
          before = call("/api/ai/config")
          if before.get("providerConfigured") is not True:
              raise RuntimeError(f"Workers AI binding is not configured: {before}")
          email = f"pexoriy-ai-acceptance-{run_id}@example.test"
          call("/api/auth/register", "POST", {"displayName":"AI Acceptance Test","email":email,"password":"Pexoriy-Acceptance-2026-Strong!"}, (200,201))
          me = call("/api/me")
          initial_ac = float(me["user"]["balances"]["AC"])
          referral_state = call("/api/referrals")
          pool = referral_state.get("communityPool", {})
          if pool.get("poolTC") != 10000 or pool.get("distribution") != "proportional-to-verified-activations":
              raise RuntimeError(f"Shared referral pool configuration is missing or changed: {pool}")
          competition_state = call("/api/competitions")
          daily_round = next((item for item in competition_state.get("rounds", []) if item.get("slug") == "daily-sprint"), None)
          if not daily_round or daily_round.get("payoutsEnabled") is not False:
              raise RuntimeError(f"Persistent daily competition round or PXY payout gate is missing: {competition_state}")
          join_result = call("/api/competitions/join", "POST", {"roundId":daily_round["id"]})
          if join_result.get("status") != "joined":
              raise RuntimeError(f"Competition entry was not persisted: {join_result}")
          sol_order_result = call("/api/payments/solana/order", "POST", {"packageId":"entry_5","idempotencyKey":f"sol-mainnet-{run_id}"}, (200,201))
          sol_order = sol_order_result.get("order")
          if not sol_order or not sol_order.get("id"): raise RuntimeError(f"Native SOL mainnet order was not created: {sol_order_result}")
          sol_verify = call("/api/payments/solana/verify", "POST", {"orderId":sol_order["id"]}, (202,))
          if sol_verify.get("status") != "pending": raise RuntimeError(f"Unpaid SOL order did not remain pending: {sol_verify}")
          ton_order_result = call("/api/payments/ton/order", "POST", {"packageId":"entry_5","idempotencyKey":f"gram-mainnet-{run_id}"}, (200,201))
          ton_order = ton_order_result.get("order")
          if not ton_order or not ton_order.get("id"): raise RuntimeError(f"Native GRAM/TON mainnet order was not created: {ton_order_result}")
          ton_verify = call("/api/payments/ton/verify", "POST", {"orderId":ton_order["id"]}, (202,))
          if ton_verify.get("status") != "pending": raise RuntimeError(f"Unpaid GRAM/TON order did not remain pending: {ton_verify}")
          after_unpaid_orders = call("/api/me")
          if abs(float(after_unpaid_orders["user"]["balances"]["AC"]) - initial_ac) > 0.01 or float(after_unpaid_orders["user"]["balances"]["PXY"]) != 0:
              raise RuntimeError("An unpaid payment order changed AC or PXY balances.")
          print("Payment acceptance evidence: SOL mainnet order created and untransacted verification returned HTTP 202 pending; GRAM/TON mainnet order created and untransacted verification returned HTTP 202 pending; no AC or PXY was issued.")
          call("/api/ai/session", "POST", {"action":"start","riskProfile":"Balanced","marketSymbol":"BTC/USDT"})
          call("/api/markets")
          first = call("/api/ai/proposals", "POST", {"symbol":"BTC/USDT","idempotencyKey":f"ci-release-{run_id}-cancel"})
          proposal = first.get("proposal")
          if not proposal or not proposal.get("id"): raise RuntimeError(f"AI inference did not produce a proposal: {first}")
          held = float(call("/api/me")["user"]["balances"]["AC"])
          if abs((initial_ac - held) - 1.5) > 0.01: raise RuntimeError(f"AI reserve was not reflected in AC balance: before={initial_ac}, held={held}")
          cancelled = call("/api/ai/proposals/cancel", "POST", {"proposalId":proposal["id"]})
          if cancelled.get("status") != "cancelled": raise RuntimeError(f"AI reservation release failed: {cancelled}")
          released = float(call("/api/me")["user"]["balances"]["AC"])
          if abs(released - initial_ac) > 0.01: raise RuntimeError(f"AI cancellation did not restore reserved AC: initial={initial_ac}, after_release={released}")
          call("/api/markets")
          second = call("/api/ai/proposals", "POST", {"symbol":"BTC/USDT","idempotencyKey":f"ci-release-{run_id}-execute"})
          proposal2 = second.get("proposal")
          if not proposal2 or not proposal2.get("id"): raise RuntimeError(f"Second live AI inference did not produce a proposal: {second}")
          executed = call("/api/ai/proposals/execute", "POST", {"proposalId":proposal2["id"],"allocationTc":100})
          if executed.get("status") != "executed" or not executed.get("position",{}).get("id"):
              raise RuntimeError(f"AI execution/AC charge did not complete: {executed}")
          final_ac = float(call("/api/me")["user"]["balances"]["AC"])
          if abs((released - final_ac) - 1.5) > 0.01:
              raise RuntimeError(f"AI AC charge mismatch: before={released}, after={final_ac}")
          activity = call("/api/ai/activity")
          types = {item.get("type") for item in activity.get("events",[])}
          if "ai.trade_fee_charged" not in types or "ai.trade_executed" not in types:
              raise RuntimeError(f"AI charge/execution audit evidence is missing: {types}")
          close = call("/api/trading/positions/close", "POST", {"positionId":executed["position"]["id"],"idempotencyKey":f"ci-release-{run_id}-close"})
          if close.get("closed") is not True: raise RuntimeError(f"Acceptance test position cleanup failed: {close}")
          mission = call("/api/missions/claim", "POST", {"missionId":"community-challenge"})
          if mission.get("status") != "paid" or mission.get("rewardTC") != 200:
              raise RuntimeError(f"Persistent competition-entry mission reward did not settle: {mission}")
          scored = call("/api/competitions")
          scored_round = next((item for item in scored.get("rounds", []) if item.get("id") == daily_round["id"]), None)
          me_row = next((item for item in (scored_round or {}).get("leaderboard", []) if item.get("isYou")), None)
          if not scored_round or not scored_round.get("joined") or not me_row or me_row.get("score", 0) < 10:
              raise RuntimeError(f"Closed simulated trade did not update the persistent leaderboard: {scored_round}")
          progress = call("/api/progress")
          earned = {badge.get("id") for badge in progress.get("badges",[]) if badge.get("earned")}
          if not {"first-trade","ai-practice"}.issubset(earned):
              raise RuntimeError(f"Server-derived progression badges did not reflect verified activity: {earned}")
          call("/api/auth/logout", "POST", {})
          print(f"PASS: live model={before.get('model')}; AC reservation 1.5; cancellation release 1.5; successful simulated execution charge 1.5; ledger/audit evidence present; test position closed; account={email}. Preview D1 only.")
          PY
      - name: Smoke-test deployed production endpoints with explicit HTTP evidence
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          base="https://pexoriy-design.mails4dikewills.workers.dev"
          check_code() {
            path="$1"; expected="$2"
            file="/tmp/pexoriy-production-$(echo "$path" | tr '/' '_').json"
            code="$(curl --connect-timeout 10 --max-time 25 -sS -o "$file" -w '%{http_code}' "$base$path" || true)"
            echo "HTTP evidence: GET $path -> $code (expected $expected)"
            if [ "$code" != "$expected" ]; then cat "$file" || true; exit 1; fi
          }
          check_code /api/health 200
          check_code /api/markets 200
          check_code /api/presale/status 200
          check_code /api/payments/solana/config 200
          check_code /api/payments/ton/config 200
          check_code /api/ai/config 200
          for endpoint in /api/learning /api/referrals /api/checkins /api/ai/activity /api/payments/solana/orders /api/payments/ton/orders; do check_code "$endpoint" 401; done
          python3 - <<'PY'
          import json
          with open("/tmp/pexoriy-production-_api_presale_status.json", encoding="utf-8") as f:
              status = json.load(f)
          assert status.get("previewEnabled") is True, status
          assert status.get("saleEnabled") is False, status
          assert status.get("launchState") == "disabled", status
          print("Production presale safety evidence: previewEnabled=true, saleEnabled=false, launchState=disabled.")
          PY
          python3 - <<'PY'
          import json
          def read(name):
              with open("/tmp/pexoriy-production-" + name + ".json", encoding="utf-8") as f: return json.load(f)
          sol = read("_api_payments_solana_config")
          ton = read("_api_payments_ton_config")
          gate = read("_api_pxy_issuance-status")
          ai = read("_api_ai_config")
          assert sol.get("enabled") is True and sol.get("network") == "solana-mainnet", sol
          assert ton.get("enabled") is True and ton.get("network") == "ton-mainnet" and ton.get("asset") == "GRAM", ton
          assert gate.get("enabled") is False and gate.get("status") == "gated", gate
          assert ai.get("providerConfigured") is True, ai
          print("Production provider/gate evidence: SOL mainnet receiver configured; native GRAM/TON mainnet receiver configured; PXY issuance gated; Workers AI binding configured.")
          PY
          echo "Production HTTPS smoke checks passed with explicit status-code evidence."
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pexoriy-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
