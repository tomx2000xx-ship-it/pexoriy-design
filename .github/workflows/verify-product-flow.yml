name: Verify Pexoriy build and rendered flows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.js && node --check worker/trading.js && node --check worker/market-feed.js
      - name: Run deterministic simulation unit tests
        run: npm run test:unit
      - name: Build production bundle with CI-only test scenario
        run: npm run build
        env:
          VITE_E2E_TESTS: 'true'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test rendered product flows
        run: npx playwright test
      - name: Smoke-test deployed API health and market feed
        env:
          PEXORIY_API_BASE: https://pexoriy-design.mails4dikewills.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PEXORIY_API_BASE/api/health" -o /tmp/pexoriy-health.json
          node -e 'const d=require("/tmp/pexoriy-health.json"); if(!d.ok || d.database!=="connected") { console.error(d); process.exit(1); } console.log("Worker health OK; D1 tables:", d.tables);'
          code=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 "$PEXORIY_API_BASE/api/markets" -o /tmp/pexoriy-markets.json -w '%{http_code}')
          MARKET_HTTP_STATUS="$code" node -e 'const d=require("/tmp/pexoriy-markets.json"); const expected=["BTC/USDT","ETH/USDT","SOL/USDT","DOGE/USDT","GRAM/USDT"]; if(Number(process.env.MARKET_HTTP_STATUS)!==200) { console.error("Market API returned HTTP", process.env.MARKET_HTTP_STATUS, d); process.exit(1); } if(!Array.isArray(d.markets) || !expected.every(s=>d.markets.some(m=>m.symbol===s))) { console.error("Market API did not return every supported market", d.markets); process.exit(1); } const unusable=d.markets.filter(m=>expected.includes(m.symbol) && (!["live","cached"].includes(m.status) || !Number.isFinite(Number(m.price)) || Number(m.price)<=0 || !m.updatedAt)); if(unusable.length) { console.error("Supported markets lack fresh validated quotes", unusable); process.exit(1); } console.log("All supported market quotes are fresh/validated:", d.markets.filter(m=>expected.includes(m.symbol)).map(m=>m.symbol+"="+m.status+"@"+m.provider).join(", "));'
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pexoriy-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
