name: Verify Pexoriy build and rendered flows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.js && node --check worker/trading.js && node --check worker/market-feed.js
      - name: Run deterministic simulation unit tests
        run: npm run test:unit
      - name: Build production bundle with CI-only test scenario
        run: npm run build
        env:
          VITE_E2E_TESTS: 'true'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test wrangler
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test rendered product flows
        run: npx playwright test
      - name: Smoke-test deployed frontend assets without database access
        run: |
          set -euo pipefail
          base="https://pexoriy-design.mails4dikewills.workers.dev"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$base/" -o /tmp/pexoriy-live-index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("/tmp/pexoriy-live-index.html").read_text(encoding="utf-8")
          assets = sorted(set(re.findall(r'(?:src|href)="([^"]*/assets/[^"]+\.(?:js|css))"', html)))
          if not any(x.endswith(".js") for x in assets) or not any(x.endswith(".css") for x in assets):
              raise SystemExit("Production homepage did not reference both JS and CSS assets")
          Path("/tmp/pexoriy-live-assets.txt").write_text("\n".join(assets), encoding="utf-8")
          print("Production homepage references:", *assets, sep="\n")
          PY
          while IFS= read -r asset; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$base$asset" -o "/tmp/pexoriy-$(basename "$asset")"
            echo "HTTP 200 static asset: $asset"
          done < /tmp/pexoriy-live-assets.txt
          grep -q 'learning-mobile-preview-note' /tmp/pexoriy-*.css
          grep -q 'All lessons' /tmp/pexoriy-*.js
          echo "Live frontend smoke passed: homepage, bundled JS/CSS, and mobile lesson UI markers are present. No API/D1 endpoints were called."
      - name: Exercise authenticated trading against local D1
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply pexoriy-core --local
          NOW_MS=$(node -e 'process.stdout.write(String(Date.now()))')
          npx wrangler d1 execute pexoriy-core --local --command "INSERT INTO market_snapshots (id, provider, symbol, price_micros, provider_timestamp_ms, validation_status, model_version) VALUES ('ci-market-btc', 'ci-fixture', 'BTC/USDT', 67482200000, $NOW_MS, 'valid', 'ci-test')"
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/pexoriy-local-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health -o /tmp/pexoriy-local-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/pexoriy-local-worker.log; exit 1; fi
          node tests/integration/trading-api.mjs
      - name: Smoke-test deployed API health and market feed
        if: contains(github.event.head_commit.message, '[db-validation]')
        env:
          PEXORIY_API_BASE: https://pexoriy-design.mails4dikewills.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PEXORIY_API_BASE/api/health" -o /tmp/pexoriy-health.json
          node -e 'const d=require("/tmp/pexoriy-health.json"); if(!d.ok || d.database!=="connected") { console.error(d); process.exit(1); } console.log("Worker health OK; D1 tables:", d.tables);'
          code1=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 "$PEXORIY_API_BASE/api/markets" -o /tmp/pexoriy-markets-1.json -w '%{http_code}')
          sleep 5
          code2=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 "$PEXORIY_API_BASE/api/markets" -o /tmp/pexoriy-markets-2.json -w '%{http_code}')
          MARKET_HTTP_STATUS_1="$code1" MARKET_HTTP_STATUS_2="$code2" node -e 'const expected=["BTC/USDT","ETH/USDT","SOL/USDT","DOGE/USDT","GRAM/USDT"]; for (const [file,status] of [["/tmp/pexoriy-markets-1.json",process.env.MARKET_HTTP_STATUS_1],["/tmp/pexoriy-markets-2.json",process.env.MARKET_HTTP_STATUS_2]]) { const d=require(file); if(Number(status)!==200) { console.error("Market API returned HTTP",status,d); process.exit(1); } if(!Array.isArray(d.markets) || !expected.every(s=>d.markets.some(m=>m.symbol===s))) { console.error("Market API did not return every supported market",d.markets); process.exit(1); } const unusable=d.markets.filter(m=>expected.includes(m.symbol) && (!["live","cached"].includes(m.status) || !Number.isFinite(Number(m.price)) || Number(m.price)<=0 || !m.updatedAt)); if(unusable.length) { console.error("Supported markets lack fresh validated quotes",unusable); process.exit(1); } console.log(file,"all supported quotes validated:",d.markets.filter(m=>expected.includes(m.symbol)).map(m=>m.symbol+"="+m.status+"@"+m.provider).join(", ")); }'
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pexoriy-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
